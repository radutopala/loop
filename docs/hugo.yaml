# Hugo + Hextra site config for Loop documentation.
#
# Build (from this directory):
#   hugo mod get -u && hugo --gc --minify
#
# CI builds via .github/workflows/pages.yaml and publishes to GitHub Pages.

baseURL: https://radutopala.github.io/loop/
title: Loop Documentation
languageCode: en-us
enableRobotsTXT: true
enableGitInfo: true

# Hextra is consumed as a Hugo module — see go.mod.
# The mount remaps the current directory as Hugo's content tree, so the
# README.md / *.md files at the root of docs/ render as site pages without
# needing to be duplicated under content/.
module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: .
      target: content
      excludeFiles:
        - hugo.yaml
        - go.mod
        - go.sum
        - .gitignore
        - .hugo_build.lock
        - README.md
        - public/**
        - resources/**
        - layouts/**
        - i18n/**

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark

# Hide the synthetic _index.md (copied from README.md at build time) from
# the sidebar tree — the homepage is reached via the navbar/title instead.
outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML]

menu:
  main:
    - identifier: docs
      name: Docs
      pageRef: /
      weight: 10
    - name: GitHub
      url: https://github.com/radutopala/loop
      weight: 20
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
  page:
    width: wide
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  editURL:
    enable: true
    base: https://github.com/radutopala/loop/edit/main/docs
