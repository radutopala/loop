version: "2"
linters:
  enable:
    - gocritic
    - misspell
    - revive
    - dupl
    - copyloopvar
    - unconvert
  settings:
    dupl:
      threshold: 120
    revive:
      rules:
        - name: exported
          disabled: true
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [dupl]
        path: _test\.go
    paths:
      - bin
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - bin
      - vendor
      - third_party$
      - builtin$
      - examples$
