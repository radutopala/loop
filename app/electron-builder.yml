appId: com.loop.app
productName: Loop
copyright: Copyright © 2026 Loop

directories:
  buildResources: build
  output: release

files:
  - dist
  - dist-electron
  - "!node_modules/**/*"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  sign: false
  artifactName: "${productName}-${version}-${arch}.dmg"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.icns

extraResources:
  - from: resources/${os}/${arch}
    to: bin
    filter:
      - "**/*"

publish:
  provider: github
  owner: radutopala
  repo: loop

extraMetadata:
  main: dist-electron/main.js
