name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.51)"
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  electron-darwin:
    needs: goreleaser
    runs-on: macos-26
    strategy:
      matrix:
        arch: [arm64, x64]
        include:
          - arch: arm64
            goreleaser_arch: arm64
          - arch: x64
            goreleaser_arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download loop binary from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="loop_${VERSION}_darwin_${{ matrix.goreleaser_arch }}.tar.gz"
          mkdir -p app/resources/mac/${{ matrix.arch }}
          gh release download "${{ github.ref_name }}" --pattern "$ARCHIVE" --dir /tmp
          tar -xzf "/tmp/$ARCHIVE" -C app/resources/mac/${{ matrix.arch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Install dependencies and set version
        # npm ci retried: the Electron postinstall download intermittently 504s.
        run: |
          cd app && (npm ci || (sleep 20 && npm ci) || (sleep 60 && npm ci))
          npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build, sign, and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd app && npm run dist:mac:${{ matrix.arch }} -- --publish never

      - name: Upload DMG, ZIP, and blockmap to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" app/release/*.dmg app/release/*.zip app/release/*.blockmap --clobber

      - name: Save update manifest
        uses: actions/upload-artifact@v7
        with:
          name: update-yml-mac-${{ matrix.arch }}
          path: app/release/latest-mac.yml

  electron-linux:
    needs: goreleaser
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            goreleaser_arch: amd64
          - arch: arm64
            goreleaser_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download loop binary from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="loop_${VERSION}_linux_${{ matrix.goreleaser_arch }}.tar.gz"
          mkdir -p app/resources/linux/${{ matrix.arch }}
          gh release download "${{ github.ref_name }}" --pattern "$ARCHIVE" --dir /tmp
          tar -xzf "/tmp/$ARCHIVE" -C app/resources/linux/${{ matrix.arch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies and set version
        # npm ci retried: the Electron postinstall download intermittently 504s.
        run: |
          cd app && (npm ci || (sleep 20 && npm ci) || (sleep 60 && npm ci))
          npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build AppImage and deb
        run: cd app && npm run dist:linux:${{ matrix.arch }} -- --publish never

      - name: Upload Linux artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" app/release/*.AppImage app/release/*.deb --clobber

      - name: Save update manifest
        if: hashFiles('app/release/latest-linux.yml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: update-yml-linux-${{ matrix.arch }}
          path: app/release/latest-linux.yml

  electron-windows:
    needs: goreleaser
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            goreleaser_arch: amd64
          - arch: arm64
            goreleaser_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download loop binary from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="loop_${VERSION}_windows_${{ matrix.goreleaser_arch }}.zip"
          mkdir -p app/resources/win/${{ matrix.arch }}
          gh release download "${{ github.ref_name }}" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP"
          unzip "$RUNNER_TEMP/$ARCHIVE" -d app/resources/win/${{ matrix.arch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies and set version
        # npm ci retried: the Electron postinstall download intermittently 504s.
        shell: bash
        run: |
          cd app && (npm ci || (sleep 20 && npm ci) || (sleep 60 && npm ci))
          npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build NSIS installer
        # Retried: electron-builder's NSIS binary download intermittently 504s
        # (the most common transient release failure). The build is idempotent.
        shell: bash
        run: cd app && (npm run dist:win:${{ matrix.arch }} -- --publish never || (sleep 30 && npm run dist:win:${{ matrix.arch }} -- --publish never))

      - name: Upload Windows artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" app/release/*.exe --clobber

      - name: Save update manifest
        if: hashFiles('app/release/latest.yml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: update-yml-win-${{ matrix.arch }}
          path: app/release/latest.yml

  update-manifests:
    needs: [electron-darwin, electron-linux, electron-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all update manifests
        uses: actions/download-artifact@v8
        with:
          pattern: update-yml-*
          path: manifests

      - name: List downloaded manifests
        run: find manifests -type f

      - name: Merge macOS manifests
        run: |
          ARM="manifests/update-yml-mac-arm64/latest-mac.yml"
          X64="manifests/update-yml-mac-x64/latest-mac.yml"
          if [ -f "$ARM" ] && [ -f "$X64" ]; then
            yq eval-all 'select(fi == 0).files += select(fi == 1).files | select(fi == 0)' "$ARM" "$X64" > latest-mac.yml
          elif [ -f "$ARM" ]; then
            cp "$ARM" latest-mac.yml
          elif [ -f "$X64" ]; then
            cp "$X64" latest-mac.yml
          fi

      - name: Merge Linux manifests
        run: |
          X64="manifests/update-yml-linux-x64/latest-linux.yml"
          ARM="manifests/update-yml-linux-arm64/latest-linux.yml"
          if [ -f "$X64" ] && [ -f "$ARM" ]; then
            yq eval-all 'select(fi == 0).files += select(fi == 1).files | select(fi == 0)' "$X64" "$ARM" > latest-linux.yml
          elif [ -f "$X64" ]; then
            cp "$X64" latest-linux.yml
          elif [ -f "$ARM" ]; then
            cp "$ARM" latest-linux.yml
          fi

      - name: Merge Windows manifests
        run: |
          X64="manifests/update-yml-win-x64/latest.yml"
          ARM="manifests/update-yml-win-arm64/latest.yml"
          if [ -f "$X64" ] && [ -f "$ARM" ]; then
            yq eval-all 'select(fi == 0).files += select(fi == 1).files | select(fi == 0)' "$X64" "$ARM" > latest.yml
          elif [ -f "$X64" ]; then
            cp "$X64" latest.yml
          elif [ -f "$ARM" ]; then
            cp "$ARM" latest.yml
          fi

      - name: Upload manifests to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=""
          [ -f latest-mac.yml ] && FILES="$FILES latest-mac.yml"
          [ -f latest-linux.yml ] && FILES="$FILES latest-linux.yml"
          [ -f latest.yml ] && FILES="$FILES latest.yml"
          if [ -n "$FILES" ]; then
            gh release upload "${{ github.ref_name }}" $FILES --clobber --repo "${{ github.repository }}"
          fi
