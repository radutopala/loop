name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  electron-darwin:
    needs: goreleaser
    runs-on: macos-26
    strategy:
      matrix:
        arch: [arm64, x64]
        include:
          - arch: arm64
            goreleaser_arch: arm64
          - arch: x64
            goreleaser_arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download loop binary from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="loop_${VERSION}_darwin_${{ matrix.goreleaser_arch }}.tar.gz"
          mkdir -p app/resources/mac/${{ matrix.arch }}
          gh release download "${{ github.ref_name }}" --pattern "$ARCHIVE" --dir /tmp
          tar -xzf "/tmp/$ARCHIVE" -C app/resources/mac/${{ matrix.arch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Install dependencies and set version
        run: |
          cd app && npm ci
          npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build, sign, and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd app && npm run dist:mac:${{ matrix.arch }} -- --publish never

      - name: Upload DMG and blockmap to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" app/release/*.dmg app/release/*.blockmap --clobber

      - name: Save update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-yml-mac-${{ matrix.arch }}
          path: app/release/latest-mac.yml

  electron-linux:
    needs: goreleaser
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            goreleaser_arch: amd64
          - arch: arm64
            goreleaser_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download loop binary from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="loop_${VERSION}_linux_${{ matrix.goreleaser_arch }}.tar.gz"
          mkdir -p app/resources/linux/${{ matrix.arch }}
          gh release download "${{ github.ref_name }}" --pattern "$ARCHIVE" --dir /tmp
          tar -xzf "/tmp/$ARCHIVE" -C app/resources/linux/${{ matrix.arch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies and set version
        run: |
          cd app && npm ci
          npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build AppImage and deb
        run: cd app && npm run dist:linux:${{ matrix.arch }} -- --publish never

      - name: Upload Linux artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" app/release/*.AppImage app/release/*.deb --clobber

      - name: Save update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-yml-linux-${{ matrix.arch }}
          path: app/release/latest-linux.yml

  update-manifests:
    needs: [electron-darwin, electron-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all update manifests
        uses: actions/download-artifact@v4
        with:
          pattern: update-yml-*
          path: manifests

      - name: Merge macOS manifests
        run: |
          yq eval-all '
            select(fi == 0).files += select(fi == 1).files |
            select(fi == 0)
          ' manifests/update-yml-mac-arm64/latest-mac.yml \
            manifests/update-yml-mac-x64/latest-mac.yml > latest-mac.yml

      - name: Merge Linux manifests
        run: |
          yq eval-all '
            select(fi == 0).files += select(fi == 1).files |
            select(fi == 0)
          ' manifests/update-yml-linux-x64/latest-linux.yml \
            manifests/update-yml-linux-arm64/latest-linux.yml > latest-linux.yml

      - name: Upload manifests to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" latest-mac.yml latest-linux.yml --clobber --repo "${{ github.repository }}"
